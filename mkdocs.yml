site_name: Stone Age Clans wiki
site_description: Draft definitions. A page stays Draft until you confirm the sentence.
docs_dir: wiki
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - navigation.tracking
    - navigation.expand
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

extra_javascript:
  - javascripts/search-nav.js

markdown_extensions:
  - toc:
      permalink: true

exclude_docs: |
  requirements.txt

nav:
